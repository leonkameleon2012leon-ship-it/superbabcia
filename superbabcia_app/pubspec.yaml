name: superbabcia_app
description: Aplikacja planera posiłków dla babci
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Ikony aplikacji
  cupertino_icons: ^1.0.2
  
  # Zarządzanie stanem
  provider: ^6.0.5
  
  # Powiadomienia
  flutter_local_notifications: ^16.3.0
  timezone: ^0.9.2
  
  # Formatowanie dat
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  # Można dodać własne fonty dla lepszej czytelności
  # fonts:
  #   - family: OpenDyslexic
  #     fonts:
  #       - asset: fonts/OpenDyslexic-Regular.ttf
